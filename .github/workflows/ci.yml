name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC: catches what breaks without a push (an action, a package, the Release asset)

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: legalrag
          POSTGRES_PASSWORD: legalrag
          POSTGRES_DB: legalrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalrag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://legalrag:legalrag@localhost:5432/legalrag
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --extra serve --locked
      - name: Lint
        run: uv run ruff check .
      - name: Fetch the quality-gate fixture (a Release asset, never committed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-fixture-v1 --pattern ci-fixture.tar.gz --dir data/ci
          tar -xzf data/ci/ci-fixture.tar.gz -C data/ci
      - name: Fetch the bge-m3 tokenizer (checksum verified; the chunking tests need it)
        run: uv run legalrag fetch tokenizer
      - name: Tests and quality gate (a skipped test fails here, see tests/conftest.py)
        run: uv run pytest -q -rs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  audit:
    # Known vulnerabilities in the locked packages (the Linux set CI installs). Not run for the macOS-only pins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv export --extra serve --locked --no-hashes --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  image:
    # The server image for linux/amd64 (the chip of the server), built and checked on every push. Nothing is pushed
    # to a registry yet: that comes with the deploy script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t legalrag:ci .
      - name: Check the image (CPU torch, not root, the command runs)
        run: |
          docker run --rm legalrag:ci python -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
          test "$(docker run --rm legalrag:ci id -u)" != 0
          docker run --rm legalrag:ci legalrag --help > /dev/null
          docker image ls legalrag:ci --format 'image size {{.Size}}'
      - name: Check the compose file and the nginx config
        env:
          POSTGRES_PASSWORD: ci
          TRACE_SECRET: ci
          DEEPSEEK_API_KEY: ci
        run: |
          docker compose -f compose.server.yaml config -q
          # --add-host: nginx refuses to start when it cannot resolve the name of the app
          docker run --rm --add-host app:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.28-alpine nginx -t
