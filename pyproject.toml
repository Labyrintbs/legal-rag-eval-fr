[project]
name = "legal-rag-eval-fr"
version = "0.1.0"
description = "French legal RAG (Code du travail + GDPR) with measured evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "beautifulsoup4",
    "lxml",
    "pandas",
    "psycopg[binary]>=3",
    "pyarrow",
    "pydantic>=2",
    "tokenizers",
    "typer",
]

[project.optional-dependencies]
# Embedding job only (GPU laptop); keeps the Mac install light.
embed = ["sentence-transformers", "torch"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
legalrag = "legalrag.cli:app"

# CUDA 12 wheel for Linux: the default CUDA 13 wheel needs a newer driver than the laptop's.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalrag"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/exploration_scripts"]

[tool.ruff.lint]
ignore = ["ISC004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
