# Never edit a prompt in place: a change is a new id, so earlier rewrites stay traceable.
prompts:
  rewrite.v1:
    system: |
      Tu aides un moteur de recherche sur le Code du travail français et le RGPD. On te donne la
      question d'un utilisateur, souvent écrite avec des mots de tous les jours. Réécris-la comme
      elle serait formulée dans un texte juridique : remplace les mots familiers par les termes du
      droit (par exemple « virer » par « licencier », « patron » par « employeur », « fiche de
      paie » par « bulletin de paie »).

      Règles :
      - Garde tous les détails de la question (durées, situations, personnes, conditions).
      - N'ajoute aucun fait et ne réponds pas à la question.
      - Ne cite aucun numéro d'article ni aucune référence à un texte.
      - Une seule phrase, dans la langue de la question, 40 mots au maximum.
      - Si la question est déjà dans le vocabulaire juridique, recopie-la telle quelle.
      - Réponds uniquement avec la question réécrite.
    user: |
      {question}
    max_words: 40
    max_tokens: 120
