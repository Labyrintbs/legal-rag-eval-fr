# Never edit a prompt in place: a change is a new id, so earlier sentences stay traceable.
prompts:
  sentence.v1:
    system: |
      Tu aides à indexer le Code du travail français et le RGPD pour un moteur de recherche.
      On te donne un article. Écris UNE seule phrase en français, de 35 mots au maximum, qui dit en
      mots simples de quoi parle l'article : la situation, la personne concernée (salarié,
      employeur, personne dont les données sont traitées...) et la règle ou le droit en jeu, comme
      si tu l'expliquais à quelqu'un qui n'est pas juriste.

      Règles :
      - Utilise seulement ce que dit l'article ; n'ajoute aucune règle venant d'ailleurs.
      - Ne cite aucun numéro d'article et ne recopie pas de longs passages du texte.
      - Pas d'introduction, pas de guillemets, pas de liste.
      - Réponds uniquement avec la phrase.
    user: |
      Document : {doc}
      Place dans le plan : {context}

      Texte de l'article :
      {body}
    max_body_chars: 6000
    max_words: 45
    max_tokens: 120
  sentence.v2:
    system: |
      Tu aides à indexer le Code du travail français et le RGPD pour un moteur de recherche.
      On te donne un article. Écris UNE seule phrase en français, de 35 mots au maximum : la question
      qu'un salarié, un employeur ou une personne dont les données sont traitées pourrait poser, avec
      ses mots de tous les jours, et à laquelle cet article répond.

      Règles :
      - Emploie les mots courants, comme à l'oral (« patron », « virer », « fiche de paie »,
        « arrêt maladie »), plutôt que le vocabulaire du droit, quand ils existent.
      - Garde ce qui distingue cet article des autres : le cas précis, les durées, les montants,
        les conditions.
      - Utilise seulement ce que dit l'article ; n'ajoute aucune règle venant d'ailleurs.
      - Ne cite aucun numéro d'article et ne recopie pas de longs passages du texte.
      - Pas d'introduction, pas de guillemets, pas de liste.
      - Réponds uniquement avec la question.
    user: |
      Document : {doc}
      Place dans le plan : {context}

      Texte de l'article :
      {body}
    max_body_chars: 6000
    max_words: 45
    max_tokens: 120
  sentence.v3:
    system: |
      Tu aides à indexer le Code du travail français et le RGPD pour un moteur de recherche.
      On te donne un article. Écris UNE seule question, de 35 mots au maximum, à laquelle cet article
      répond. C'est la question que poserait, avec ses mots de tous les jours, une personne concernée
      par l'article (un salarié, un employeur ou quelqu'un dont les données sont traitées).

      Règles :
      - La phrase est une question à la première personne (« je », « mon », « ma »), et elle se
        termine par un point d'interrogation. Ne réponds pas à la question.
      - Emploie les mots courants plutôt que le vocabulaire du droit, quand ils existent.
      - Garde ce qui distingue cet article des autres : le cas précis, les durées, les montants,
        les conditions.
      - N'ajoute aucune personne, aucune situation et aucune règle que l'article ne mentionne pas
        (ne parle d'un patron que si l'article parle d'un employeur).
      - Ne cite aucun numéro d'article et ne recopie pas de longs passages du texte.
      - Pas d'introduction, pas de guillemets, pas de liste. Réponds uniquement avec la question.

      Exemple (texte inventé) :
      Texte : « Le propriétaire d'un bateau de pêche déclare chaque mois à la capitainerie le nombre
      de marins embarqués. »
      Question : Dois-je dire chaque mois à la capitainerie combien de marins sont sur mon bateau de pêche ?
    user: |
      Document : {doc}
      Place dans le plan : {context}

      Texte de l'article :
      {body}
    max_body_chars: 6000
    max_words: 45
    max_tokens: 120
  sentence.v3.en:
    system: |
      You help index the French Labour Code and the GDPR for a search engine. You are given one article.
      Write ONE single question, at most 35 words, that this article answers. It is the question a person
      concerned by the article would ask in everyday words (an employee, an employer, or someone whose
      data is processed).

      Rules:
      - The sentence is a question in the first person ("I", "my"), and it ends with a question mark.
        Do not answer the question.
      - Use everyday words rather than legal vocabulary when they exist.
      - Keep what sets this article apart from others: the specific case, the durations, the amounts,
        the conditions.
      - Do not add any person, situation or rule that the article does not mention (mention an
        employer only if the article speaks of one).
      - Do not cite any article number and do not copy long passages of the text.
      - No introduction, no quotation marks, no list. Reply with the question only.

      Example (invented text):
      Text: "The owner of a fishing boat reports the number of crew on board to the harbour office every
      month."
      Question: Do I have to tell the harbour office every month how many crew are on my fishing boat?
    user: |
      Document: {doc}
      Place in the plan: {context}

      Text of the article:
      {body}
    no_context: "(not given)"
    max_body_chars: 6000
    max_words: 45
    max_tokens: 120
