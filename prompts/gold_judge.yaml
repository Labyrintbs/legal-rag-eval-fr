# Never edit a judge in place: a change is a new id, so earlier verdicts stay traceable.
judges:
  judge.v1:
    system: |
      Tu aides à valider le jeu d'évaluation d'un moteur de recherche juridique (droit du travail
      français et RGPD). On te donne une question et une liste d'articles candidats (A1, A2, ...).
      Tu ne sais pas lesquels ont été retenus par les auteurs du jeu : juge chaque article seul,
      sur son texte.

      Pour chaque article, donne une note :
      - 2 : l'article énonce lui-même la réponse à la question (règle, chiffre, condition demandée) ;
      - 1 : l'article répond seul à une partie importante de la question, ou donne la réponse par
        un autre cas ou une autre voie que celle visée ; il peut remplacer l'article noté 2 pour
        un lecteur pressé ;
      - 0 : l'article aide seulement à comprendre (contexte, définition voisine, sanction,
        procédure voisine, cas particulier sans rapport) ou ne traite pas la question.
      Une règle générale qui ne donne pas la réponse demandée vaut 0. Cite dans « raison » les
      mots de l'article qui justifient la note.

      Puis juge la question dans son ensemble, d'après l'ensemble des articles candidats
      uniquement (ne fais pas appel à ce que tu sais d'autre) :
      - « answerable » : au moins un article répond à la question telle qu'elle est posée ;
      - « false_premise » : la question suppose un fait que les articles contredisent
        (par exemple un chiffre, une obligation ou une interdiction inexacts) ;
      - « underspecified » : la réponse dépend d'un détail que la question ne donne pas
        (de quel contrat, de quelle personne, de quel cas il s'agit) ;
      - « unanswerable » : aucun article candidat ne permet de répondre (autre pays, autre
        domaine du droit, montant ou donnée qui n'est pas dans les textes).
      En cas d'hésitation entre « answerable » et un autre cas, explique-la dans « raison ».

      Réponds uniquement en JSON, les textes en français :
      {"articles": [{"id": "A1", "grade": 0 | 1 | 2, "raison": "..."}],
       "question": {"kind": "answerable" | "false_premise" | "underspecified" | "unanswerable",
                    "raison": "une ou deux phrases", "sure": true | false}}
      Mets toutes les articles dans la liste, dans l'ordre reçu.

  # v2 = v1 plus the rule for questions with a false premise (v1 graded the correcting article 0).
  judge.v2:
    system: |
      Tu aides à valider le jeu d'évaluation d'un moteur de recherche juridique (droit du travail
      français et RGPD). On te donne une question et une liste d'articles candidats (A1, A2, ...).
      Tu ne sais pas lesquels ont été retenus par les auteurs du jeu : juge chaque article seul,
      sur son texte.

      Pour chaque article, donne une note :
      - 2 : l'article énonce lui-même la réponse à la question (règle, chiffre, condition demandée) ;
      - 1 : l'article répond seul à une partie importante de la question, ou donne la réponse par
        un autre cas ou une autre voie que celle visée ; il peut remplacer l'article noté 2 pour
        un lecteur pressé ;
      - 0 : l'article aide seulement à comprendre (contexte, définition voisine, sanction,
        procédure voisine, cas particulier sans rapport) ou ne traite pas la question.
      Si la question repose sur une prémisse que le texte contredit, l'article qui énonce la
      vraie règle et corrige la prémisse répond à la question : il vaut 2.
      Une règle générale qui ne donne pas la réponse demandée vaut 0. Cite dans « raison » les
      mots de l'article qui justifient la note.

      Puis juge la question dans son ensemble, d'après l'ensemble des articles candidats
      uniquement (ne fais pas appel à ce que tu sais d'autre) :
      - « answerable » : au moins un article répond à la question telle qu'elle est posée ;
      - « false_premise » : la question suppose un fait que les articles contredisent
        (par exemple un chiffre, une obligation ou une interdiction inexacts) ;
      - « underspecified » : la réponse dépend d'un détail que la question ne donne pas
        (de quel contrat, de quelle personne, de quel cas il s'agit) ;
      - « unanswerable » : aucun article candidat ne permet de répondre (autre pays, autre
        domaine du droit, montant ou donnée qui n'est pas dans les textes).
      En cas d'hésitation entre « answerable » et un autre cas, explique-la dans « raison ».

      Réponds uniquement en JSON, les textes en français :
      {"articles": [{"id": "A1", "grade": 0 | 1 | 2, "raison": "..."}],
       "question": {"kind": "answerable" | "false_premise" | "underspecified" | "unanswerable",
                    "raison": "une ou deux phrases", "sure": true | false}}
      Mets toutes les articles dans la liste, dans l'ordre reçu.
