# The server stack, used with `docker compose -f compose.server.yaml` (docker-compose.yml is the dev database) (see docs/decisions/0009-deployment-stage-plan.md, S4). Only the proxy publishes a port.
# Secrets come from the environment file `.env` (never in git; the names are in .env.example).

name: legalrag

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: legalrag
      POSTGRES_DB: legalrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag -d legalrag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: legalrag:${CODE_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql://legalrag:${POSTGRES_PASSWORD}@db:5432/legalrag
      # The model provider (llm.provider_from_env): all empty means DeepSeek with DEEPSEEK_API_KEY. The app stops at start
      # when there is no key, no price for the model or a base URL that is not https.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_THINKING_OFF: ${LLM_THINKING_OFF:-}
      TRACE_SECRET: ${TRACE_SECRET:?set TRACE_SECRET in .env}
      CLIENT_IP_HEADER: X-Real-IP  # the header nginx sets; the app is reachable only through nginx
      CODE_VERSION: ${CODE_VERSION:-dev}
      EMBED_REVISION: ${EMBED_REVISION:-}  # empty: the revision stored with the vectors; set only for a test database
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  models:
