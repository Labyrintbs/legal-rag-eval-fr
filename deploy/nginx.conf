# The proxy in front of the app (decision D4). Plain HTTP for now; certbot and port 443 come in phase 2.
server_tokens off;
client_max_body_size 16k;
client_header_timeout 10s;
client_body_timeout 10s;
client_header_buffer_size 4k;
large_client_header_buffers 4 8k;
# No access log, and only severe errors in the error log: both would otherwise carry visitors' addresses.
access_log off;
error_log /dev/stderr crit;

server {
    listen 80 default_server;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaces any value the visitor sent: the app trusts this header (CLIENT_IP_HEADER).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
